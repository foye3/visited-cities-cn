name: Publish PR Pages preview

on:
  workflow_run:
    workflows:
      - PR validation and local preview
    types:
      - completed

concurrency:
  group: pages-publish
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.pull_requests[0].number != null
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      pages: write
      id-token: write
      issues: write
      pull-requests: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - name: Checkout trusted repository state
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          path: state

      - name: Download static PR preview
        uses: actions/download-artifact@v4
        with:
          name: pr-${{ env.PR_NUMBER }}-pages-preview
          path: incoming-preview
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Validate untrusted static artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f incoming-preview/index.html

          if find incoming-preview -type l -print -quit | grep -q .; then
            echo "Preview artifacts must not contain symbolic links." >&2
            exit 1
          fi

          file_count="$(find incoming-preview -type f | wc -l)"
          byte_count="$(du -sb incoming-preview | cut -f1)"
          if (( file_count > 10000 || byte_count > 104857600 )); then
            echo "Preview artifact exceeds the file-count or 100 MiB safety limit." >&2
            exit 1
          fi

      - name: Persist this PR preview
        shell: bash
        run: |
          set -euo pipefail
          cd state
          git fetch origin pages-content:refs/remotes/origin/pages-content || true
          if git show-ref --verify --quiet refs/remotes/origin/pages-content; then
            git switch -C pages-content origin/pages-content
          else
            echo "pages-content does not exist yet; let the main deployment finish first." >&2
            exit 1
          fi

          preview_dir="preview/pr-${PR_NUMBER}"
          rm -rf "${preview_dir}"
          mkdir -p "${preview_dir}"
          cp -a ../incoming-preview/. "${preview_dir}/"
          touch .nojekyll

          git add --all -- "${preview_dir}" .nojekyll
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update preview for PR #${PR_NUMBER}"
            git push origin pages-content
          fi

      - name: Assemble production and active previews
        shell: bash
        run: |
          set -euo pipefail
          test -d state/production
          mkdir -p deploy
          cp -a state/production/. deploy/
          if [[ -d state/preview ]]; then
            mkdir -p deploy/preview
            cp -a state/preview/. deploy/preview/
          fi
          touch deploy/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: deploy

      - name: Deploy combined Pages content
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Add or update preview link
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- pages-preview -->';
            const issue_number = Number(process.env.PR_NUMBER);
            const url = `https://${context.repo.owner}.github.io/${context.repo.repo}/preview/pr-${issue_number}/`;
            const body = `${marker}\nGitHub Pages preview: ${url}\n\nUpdated from commit \`${{ github.event.workflow_run.head_sha }}\`.`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
            });
            const previous = comments.find(
              (comment) => comment.user?.type === 'Bot' && comment.body?.includes(marker),
            );
            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body,
              });
            }
